name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate default Open Graph image
        run: node scripts/make-og.mjs

      - name: Правила вёрстки и авто-типограф
        run: npm run check:rules && npm run check:typeset

      - name: Типы
        run: npm run check

      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://agubanovv.ru' }}
          PUBLIC_REPO: ${{ github.repository }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'tonygubanovv@yandex.ru' }}
          PUBLIC_CONTACT_TELEGRAM: ${{ vars.CONTACT_TELEGRAM || 'tonygubanovv' }}
          PUBLIC_CONTACT_GITHUB: ${{ vars.CONTACT_GITHUB || 'https://github.com/tonygubanovv' }}

      - name: Контент по собранному HTML
        run: npm run check:content

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
